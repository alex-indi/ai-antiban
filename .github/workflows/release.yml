name: Release & CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust unit & security tests
        if: matrix.platform == 'macos-latest'
        run: cargo test --lib --test edge_cases_and_security_tests --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: |
            ## Застава ${{ github.ref_name }}: масштабное обновление v1.3.0

            ### 1. Windows 11: исправление «залипания» прокси после закрытия и удаления
            - Прокси больше не пишется в постоянный `HKCU\Environment`, сессионные переменные очищаются корректно.
            - Проверка в PowerShell `$PROFILE` работает за 0 мс через быструю таблицу ядра `GetActiveTcpListeners()`.
            - Добавлен NSIS-хук деинсталлятора `hooks.nsh` и режим `Zastava.exe --cleanup`, а также кнопка сброса прокси-хвостов в 1 клик.
            - **Отдельная благодарность @NjemTop** за наводку и детальный разбор поведения реестра и деинсталлятора на Windows!

            ### 2. Уведомления в правом верхнем углу без перехвата фокуса и авто-правила
            - Окно при сбое VPN больше не перехватывает фокус клавиатуры и не мешает набору текста.
            - Оповещение не дублируется в главном окне и удобно закрывается по `✕` или `Esc`.
            - Поддерживаются 3 режима работы: «Уведомление в углу», «Тихая авто-пауза без окон» и «Авто-пропуск безопасных стран».

            ### 3. Обновлённый фирменный системный трей и кнопка «СТОП СЕТИ»
            - Убрана дублирующаяся вторая иконка в тулбаре macOS.
            - Меню трея разделено на удобные тематические подразделы с быстрым переключением профилей Claude и экстренной кнопкой «СТОП СЕТИ».

            ### 4. Новая вкладка «Бэкап и Профили»
            - Экспорт, импорт и бэкап памяти Claude (`~/.claude`) и удобное управление мульти-аккаунтами вынесены в отдельную вкладку верхнего меню.

            ### 5. Поддержка Throne (режим TUN), фикс Amnezia на macOS и расширенная матрица ИИ
            - Поддержка FakeIP `198.18.0.0/15` для Throne в режиме TUN.
            - Устранение ложных срабатываний Amnezia на macOS без смены IP.
            - Точная проверка отключённой геолокации Windows 11.
            - Защита Word/Excel Copilot, VS Code, Cursor, Windsurf, Perplexity, DeepSeek, Grok + добавление своих ИИ-доменов.

            ### 6. Обновлённые гайды по VPN
            - Отдельная вкладка «VLESS в 1 команду» и переписанная пошаговая инструкция «Непробиваемый VPN (3 способа)» для обычных пользователей.

            ### Что осталось из версии 1.2.x
            - Живой пульс защиты, 12 проверок безопасности, Авто-TZ, краш-тест обрыва VPN, Zero-MITM шлюз, помощник оформления подписки, 2-Hop ключ "Чистый IP", автообновление в 1 клик с перезапуском.

            ### О приложении (для новых пользователей)
            - Застава это бесплатная десктопная утилита с открытым исходным кодом для macOS и Windows. Она защищает аккаунты Claude, ChatGPT и Gemini от банов при обрывах VPN и смене маршрутов.
            - Соединение с нейросетью ставится на паузу при падении туннеля до того, как запрос уйдет с реального IP.
            - Без расшифровки TLS, без подмены сертификатов, без доступа к вашим ключам, коду и переписке.
            - Обычный трафик (Git, npm, сайты, мессенджеры) идет напрямую без задержки.

            ### Установка
            - macOS (Apple Silicon и Intel): скачайте Zastava_1.3.0_universal.dmg и перетащите приложение в Applications.
            - Windows (x64): скачайте Zastava_1.3.0_x64-setup.exe или Zastava_1.3.0_x64_en-US.msi.
            - Если Застава уже установлена: нажмите "Обновления" в шапке программы, установка пройдет в 1 клик.

            Все установочные файлы собраны автоматически через GitHub Actions из открытого исходного кода в этом репозитории.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
