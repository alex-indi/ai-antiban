name: Release & CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust unit & security tests
        if: matrix.platform == 'macos-latest'
        run: cargo test --lib --test edge_cases_and_security_tests --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: |
            ## Застава ${{ github.ref_name }} — защита аккаунтов Claude, ChatGPT и Gemini от банов при обрывах VPN

            **Застава** — бесплатная десктопная утилита с открытым исходным кодом для **macOS** и **Windows**. Если во время работы у вас на секунду моргнёт Wi-Fi или отвалится VPN, Застава мгновенно перехватит и поставит запросы к нейросетям на паузу раньше, чем ваш настоящий IP-адрес улетит на серверы Anthropic или OpenAI. При этом все обычные сайты, мессенджеры, звонки и рабочие программы продолжают работать напрямую без задержек.

            ---

            ### 🚀 Что нового в v1.3.1 (Хотфикс)

            #### ⚡ 1. Мгновенный радар при запуске
            Устранена задержка на старте: теперь полная диагностика по 12 параметрам безопасности, определение вашего текущего провайдера, страны и пинга до серверов ИИ срабатывают **с первой же секунды** при открытии программы — больше не нужно вручную нажимать кнопку «Обновить».

            #### 🕒 2. Исправление сдвига времени на Windows (-3 часа в Telegram и других приложениях)
            - В предыдущей сборке авто-синхронизация часового пояса записывала переменную `TZ` в общие настройки пользователя Windows (`HKCU\Environment\TZ`). Из-за этого сторонние программы (например, Telegram Desktop) могли переходить на время UTC+0 (сдвиг на -3 часа от Москвы).
            - **Теперь Застава никогда не трогает системное время Windows и часы других программ** — часовой пояс передаётся изолированно только в тот процесс ИИ, который вы сами запускаете через кнопку в Заставе.
            - **Авто-лечение:** при первом же запуске `v1.3.1` программа сама проверит реестр и бесследно удалит старую настройку, вернув часам в Telegram и других приложениях родное время (просто перезапустите Telegram).
            - *Если вы уже удалили старую версию и хотите вернуть время вручную без установки:* нажмите `Win + R`, вставьте команду ниже и нажмите Enter (затем перезапустите Telegram):
              ```cmd
              cmd /c "reg delete HKCU\Environment /v TZ /f & powershell -NoProfile -Command [Environment]::SetEnvironmentVariable('TZ',$null,'User')"
              ```

            #### ✨ 3. Удобный главный экран и чистая навигация
            - **Двухуровневая шапка:** кнопки и индикаторы больше не налезают друг на друга даже в самом узком окне программы.
            - **Отдельная вкладка «Бэкап»:** короткое название без переноса строк и удобное переключение с верхнего меню.
            - **Единая прокрутка в гиде по VPN:** список проверенных хостингов больше не заперт в маленьком внутреннем окошке со вторым скроллбаром.

            ---

            ### 🛡️ Главные возможности линейки v1.3 (включая обновления 1.3.0)

            #### 🛑 Кнопка экстренной заморозки «СТОП СЕТИ» и тихий режим без всплывающих окон
            - **Никаких помех при печати:** если VPN упал, уведомление аккуратно появляется в углу экрана и **не перехватывает фокус клавиатуры** — вы не нажмёте случайную кнопку, пока печатаете текст или код. Закрывается по `✕` или клавише `Esc`.
            - **Три режима на выбор:**
              1. *Уведомление в углу* — спросить, что делать с соединениями ИИ.
              2. *Тихая авто-пауза без окон* — молча заморозить запросы к ИИ до возвращения VPN, вообще не отвлекая вас от работы.
              3. *Доверять безопасным странам* — не тревожить при переключении между разрешёнными локациями.
            - **Кнопка «СТОП СЕТИ» в шапке и в трее:** в один клик мгновенно блокирует любой трафик к нейросетям, если вам нужно срочно переключить сеть или перезагрузить роутер.

            #### 💾 Вкладка «Бэкап» и мульти-аккаунт Claude в 1 клик
            - **Бэкап на Рабочий стол:** сохраняйте всю память, историю чатов, промпты и настройки Claude в один аккуратный ZIP-архив и восстанавливайте их на любом компьютере за пару секунд.
            - **Переключение аккаунтов:** мгновенно меняйте рабочие и личные профили Claude прямо из вкладки «Бэкап» или из иконки Заставы в системном трее (возле часов).

            #### 🌐 Полная защита браузеров, десктопных приложений, Word/Excel Copilot и IDE
            - Защита работает для **Claude, ChatGPT, Gemini, Perplexity, DeepSeek, Grok**, десктопных клиентов, **Microsoft Word / Excel Copilot**, а также редакторов **Cursor, Windsurf и VS Code** (плюс можно добавить любые свои сайты).
            - **Дружба с популярными VPN:** полноценная поддержка режима **TUN в клиенте Throne** на Windows 11 и работа с **Amnezia VPN на macOS** без ложных тревог.
            - **Свой личный VPN за 2 минуты:** во вкладке *«VLESS в 1 команду»* и *«Непробиваемый VPN»* собраны простые пошаговые инструкции для людей без технического опыта — как арендовать сервер за ~150–300 ₽ и одной скопированной командой поднять личный неблокируемый VPN.

            #### 🧹 Чистое закрытие и удаление на Windows 11
            - Никаких «залипших» настроек прокси после выхода из программы или удаления Заставы: все сессионные переменные и правила очищаются мгновенно и дочиста, плюс в настройках есть кнопка сброса сетевых хвостов в 1 клик.
            - 🤝 **Отдельная благодарность [@NjemTop](https://github.com/NjemTop)** за внимательное тестирование, обратную связь и отличные идеи по улучшению очистки прокси и деинсталлятора для пользователей Windows!

            ---

            ### 📥 Как установить или обновиться
            - **Если Застава уже установлена:** просто нажмите кнопку **«Обновления»** в верхней шапке программы — она сама скачает `v1.3.1` и перезапустится за пару секунд.
            - **macOS (Apple Silicon M1–M4 и Intel):** скачайте файл `Zastava_1.3.1_universal.dmg` ниже и перетащите иконку в папку `Applications`.
            - **Windows 10 / 11 (x64):** скачайте установщик `Zastava_1.3.1_x64-setup.exe` (или `.msi`) ниже и запустите его.

            *Все установочные файлы собираются автоматически через GitHub Actions напрямую из открытого исходного кода — без скрытых модулей, без сбора телеметрии и без доступа к вашим перепискам и паролям.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
